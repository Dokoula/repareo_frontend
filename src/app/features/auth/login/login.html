<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <header class="auth-header">
      <a routerLink="/login" class="brand" aria-label="Repareo">
        <span class="brand-mark"><i class="bi bi-tools"></i></span>
        <span>Repareo</span>
      </a>
      <h1 id="login-title">Connexion</h1>
      <p>Accédez simplement à votre espace.</p>
    </header>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="field-group">
        <label for="username">Nom d’utilisateur</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="Votre identifiant"
          [class.invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
          aria-describedby="username-error"
        />
        <p id="username-error" class="field-error" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          Le nom d’utilisateur est obligatoire.
        </p>
      </div>

      <div class="field-group">
        <label for="password">Mot de passe</label>
        <div class="password-field" [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Votre mot de passe"
            aria-describedby="password-error"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
            <i [class]="showPassword() ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
        <p id="password-error" class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Le mot de passe doit contenir au moins 4 caractères.
        </p>
      </div>

      <label class="remember-control">
        <input type="checkbox" formControlName="rememberMe" />
        <span>Rester connecté</span>
      </label>

      <button type="submit" class="primary-button" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">Se connecter</span>
        <span *ngIf="isLoading()" class="loading-label">
          <span class="spinner" aria-hidden="true"></span>
          Connexion en cours
        </span>
      </button>
    </form>

    <footer class="auth-footer">
      <span>Vous n’avez pas de compte ?</span>
      <a routerLink="/register">Créer un compte</a>
    </footer>
  </section>
</main>

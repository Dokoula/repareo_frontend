<div class="space-y-6 animate-fade-in pb-12">
  
  <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 card-shadow">
    <span class="text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-200 inline-block mb-2">
      Paramètres Personnels
    </span>
    <h1 class="text-2xl font-black text-slate-900">Mon Profil Client</h1>
    <p class="text-xs sm:text-sm text-slate-500 mt-1">
      Gérez vos coordonnées pour la récupération de vos ordinateurs et la réception des devis.
    </p>
  </div>

  <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 card-shadow max-w-2xl">
    <form [formGroup]="profilForm" (ngSubmit)="save()" class="space-y-4">
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">
          Nom d'utilisateur (Identifiant unique)
        </label>
        <input
          type="text"
          formControlName="username"
          class="w-full px-4 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-xs text-slate-500 font-bold"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
            Adresse Email
          </label>
          <input
            type="email"
            formControlName="email"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
            Numéro de téléphone
          </label>
          <input
            type="tel"
            formControlName="telephone"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
            Ville / Commune
          </label>
          <select
            formControlName="ville"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option *ngFor="let v of villesSenegal" [value]="v">{{ v }}</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
            Adresse complète (Quartier, Rue...)
          </label>
          <input
            type="text"
            formControlName="adresse"
            placeholder="Ex : Plateau, Avenue Léopold Sédar Senghor"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
      </div>

      <div class="pt-4 border-t border-slate-100">
        <button
          type="submit"
          [disabled]="isSaving()"
          class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md shadow-indigo-500/25 transition">
          {{ isSaving() ? 'Enregistrement...' : 'Enregistrer les modifications' }}
        </button>
      </div>

    </form>
  </div>

</div>

<div class="space-y-6 animate-fade-in pb-12">
  
  <div class="bg-slate-800/90 rounded-3xl p-6 sm:p-8 border border-slate-700 shadow-xl">
    <span class="text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full bg-teal-500/20 text-teal-300 border border-teal-500/30 inline-block mb-2">
      Certification & Réseau
    </span>
    <h1 class="text-2xl font-black text-white">Profil Professionnel Technicien</h1>
    <p class="text-xs sm:text-sm text-slate-400 mt-1">
      Configurez vos spécialités informatiques pour recevoir les demandes pertinentes générées par l'IA.
    </p>
  </div>

  <div class="bg-slate-800/90 rounded-3xl p-6 sm:p-8 border border-slate-700 shadow-xl max-w-3xl space-y-6">
    
    <div class="flex items-center gap-3 p-4 rounded-2xl bg-teal-950/40 border border-teal-800/40">
      <i class="bi bi-patch-check-fill text-2xl text-teal-400"></i>
      <div>
        <h4 class="text-xs font-bold text-white">Statut : Réparateur Agréé Repareo</h4>
        <p class="text-[11px] text-teal-300">Votre compte a été vérifié et certifié par l'administration.</p>
      </div>
    </div>

    <form [formGroup]="profilForm" (ngSubmit)="save()" class="space-y-4">
      
      <div>
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">
          Identifiant d'accès
        </label>
        <input
          type="text"
          formControlName="username"
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-400 font-bold"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-300 mb-1">
            Email professionnel
          </label>
          <input
            type="email"
            formControlName="email"
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500"
          />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-300 mb-1">
            Numéro de téléphone direct
          </label>
          <input
            type="tel"
            formControlName="telephone"
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-300 mb-1">
            Ville / Zone d'intervention
          </label>
          <input
            type="text"
            formControlName="ville"
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500"
          />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-300 mb-1">
            Années d'expérience
          </label>
          <input
            type="number"
            formControlName="experience"
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-300 mb-1">
          Spécialité & Domaines d'expertise
        </label>
        <input
          type="text"
          formControlName="specialite"
          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500"
        />
      </div>

      <div class="pt-4 border-t border-slate-700">
        <button
          type="submit"
          [disabled]="isSaving()"
          class="px-6 py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-black text-xs rounded-xl shadow-lg transition">
          {{ isSaving() ? 'Enregistrement...' : 'Enregistrer les modifications' }}
        </button>
      </div>

    </form>
  </div>

</div>

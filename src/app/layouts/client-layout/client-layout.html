<div class="app-frame">
  <aside class="app-sidebar" [class.app-sidebar-open]="isMobileMenuOpen()">
    <div class="app-brand">
      <span class="app-brand-icon"><i class="bi bi-tools"></i></span>
      <div><strong>Repareo</strong><small>Espace client</small></div>
      <button type="button" class="app-sidebar-close" (click)="closeMobileMenu()" aria-label="Fermer le menu"><i class="bi bi-x-lg"></i></button>
    </div>

    <nav class="app-navigation" aria-label="Navigation client">
      <span class="app-navigation-title">Navigation</span>
      <a *ngFor="let item of navItems" [routerLink]="item.route" (click)="closeMobileMenu()"
         routerLinkActive="app-navigation-active">
        <i [class]="item.icon"></i><span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="app-sidebar-footer">
      <a routerLink="/client/messages"><i class="bi bi-question-circle"></i><span>Assistance</span></a>
      <button type="button" (click)="logout()"><i class="bi bi-box-arrow-left"></i><span>Déconnexion</span></button>
    </div>
  </aside>

  <div class="app-workspace">
    <header class="app-topbar">
      <div class="app-topbar-start">
        <button type="button" class="app-menu-button" (click)="toggleMobileMenu()" aria-label="Ouvrir le menu"><i class="bi bi-list"></i></button>
        <div><strong>Espace client</strong><small>{{ authService.currentUser()?.ville || 'Ville non renseignée' }}</small></div>
      </div>

      <div class="app-topbar-actions">
        <a routerLink="/client/nouvelle-demande" class="app-primary-action"><i class="bi bi-plus-lg"></i><span>Nouvelle demande</span></a>

        <div class="app-popover-wrapper">
          <button type="button" class="app-icon-button" (click)="toggleNotifications()" aria-label="Notifications">
            <i class="bi bi-bell"></i>
            <span *ngIf="notificationService.unreadCount() > 0" class="app-counter">{{ notificationService.unreadCount() }}</span>
          </button>
          <section *ngIf="isNotificationMenuOpen()" class="app-popover app-notifications">
            <header><strong>Notifications</strong><span>{{ notificationService.unreadCount() }} non lue(s)</span></header>
            <div class="app-notification-list">
              <button type="button" *ngFor="let notification of notifications()" (click)="lireNotification(notification)" [class.unread]="!notification.lu">
                <strong>{{ notification.titre }}</strong><span>{{ notification.contenu }}</span><small>{{ notification.date_notification | date:'short' }}</small>
              </button>
              <p *ngIf="notifications().length === 0" class="app-empty-note">Aucune notification.</p>
            </div>
          </section>
        </div>

        <div class="app-popover-wrapper">
          <button type="button" class="app-user-button" (click)="toggleUserMenu()">
            <span class="app-avatar">{{ (authService.currentUser()?.username || 'C').charAt(0).toUpperCase() }}</span>
            <span class="app-user-copy"><strong>{{ authService.currentUser()?.username || 'Client' }}</strong><small>Client</small></span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <section *ngIf="isUserMenuOpen()" class="app-popover app-user-menu">
            <a routerLink="/client/profil" (click)="isUserMenuOpen.set(false)"><i class="bi bi-person"></i>Mon profil</a>
            <button type="button" (click)="logout()"><i class="bi bi-box-arrow-left"></i>Déconnexion</button>
          </section>
        </div>
      </div>
    </header>

    <main class="app-content"><router-outlet></router-outlet></main>
  </div>

  <button *ngIf="isMobileMenuOpen()" type="button" class="app-sidebar-overlay" (click)="closeMobileMenu()" aria-label="Fermer le menu"></button>
</div>
